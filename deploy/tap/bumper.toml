# tap on bumper, the collector box on the museum floor. Deployed by
# scripts/deploy-tap.sh to /home/tap/tap.toml; secrets come from /home/tap/.env.
#
# bumper is on the fleet's subnet (192.168.2.0/24), so discovery works and the
# container runs with host networking to let the broadcast out. The known
# devices are pinned as well: discovery adds and refreshes, but a discovered
# device that stops answering is dropped from the roster after three rounds,
# while a pinned one stays and reads OFFLINE. On a box meant to run unattended
# for months, a dead strip should be a visible row, not an absence — the live-
# gap measurements caught one dark for 387 s that nothing had reported.
# Roster as swept on 2026-09-13; add a line when a strip is added.

[tap]
id = "bumper"
buffer_dir = "/data/buffer"     # /home/tap/buffer on the host
retention_days = 30             # ~125 MB/day at the fleet's outlet count, ~4 GB
log_dir = "/data/logs"          # /home/tap/logs on the host, one file per UTC day
log_retention_days = 365
log_level = "INFO"

[web]
host = "127.0.0.1"              # reach it with: ssh -L 8010:127.0.0.1:8010 bumper
port = 8010

[uplink]
# Standalone for now: poll and buffer, upload nothing. To start uploading, set
# TAP_UPLINK_URL and TAP_UPLINK_TOKEN in the deploy environment and re-run
# `make deploy-tap`; the server's cursor decides where the upload starts.
# url = "wss://juice.theflip.museum/api/v2/ingest"
enabled = true

[discovery]
enabled = true

[[device]]
host = "192.168.2.8"            # HS300 "Power Strip_8EDF"
family = "iot"

